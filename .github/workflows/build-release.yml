name: Build and Release

# Three ways in, two outcomes:
#   - push to any branch            -> build + signed APK/AAB as a downloadable workflow
#                                      artifact (run's Summary page). No tag, no Release.
#   - "Run workflow" w/o a version  -> same as above, for any ref you pick.
#   - push a vX.Y.Z tag, or
#     "Run workflow" with a version -> the real thing: a GitHub Release with the files attached.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (optional, e.g., v1.0.2). Leave empty for just a build artifact.'
        required: false
        type: string

# A newer push to the same branch supersedes a build still running for it; tags are unique
# refs, so releases are never cancelled by this.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x lint

      - name: Build Release APK
        run: ./gradlew app:assembleRelease

      - name: Build Release Bundle
        run: ./gradlew app:bundleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Sign Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_bundle
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename release artifacts
        run: |
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" NotApp.apk
          mv "${{ steps.sign_bundle.outputs.signedReleaseFile }}" NotApp.aab

      # Branch push, or manual "Run workflow" with no version filled in: just hand back the
      # signed APK/AAB as a downloadable workflow artifact (from the run's Summary page) —
      # no tag, no GitHub Release, nothing permanent. For "let me see what this
      # branch/commit builds into" without cutting a version.
      - name: Upload build artifacts
        if: github.ref_type != 'tag' && (github.event_name != 'workflow_dispatch' || github.event.inputs.version == '')
        uses: actions/upload-artifact@v4
        with:
          name: NotApp-${{ github.sha }}
          path: |
            NotApp.apk
            NotApp.aab
          retention-days: 14

      # Real release: either a `vX.Y.Z` tag was pushed, or "Run workflow" was given
      # an explicit version to cut a release under.
      - name: Create Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: |
            NotApp.apk
            NotApp.aab
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
